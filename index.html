<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Inner Tech Lab by Marijke Wouters — breathing behavior analysis and nervous system regulation.">
    <title>Inner Tech Lab | Marijke Wouters</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            font-family: Georgia, 'Times New Roman', serif;
            color: #2a2a2a;
            background: #ffffff;
            -webkit-font-smoothing: antialiased;
        }

        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .logo-header {
            width: 100%;
            padding: 32px 20px 8px;
            text-align: center;
        }

        .logo-header img {
            max-width: 520px;
            width: 100%;
            height: auto;
        }

        .socials {
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 0 20px 20px;
        }

        .socials a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            color: #2a8f7e;
            transition: all 0.2s ease;
            text-decoration: none;
        }

        .socials a:hover {
            background: #f0f6f4;
            color: #1f6b62;
        }

        .socials svg {
            width: 22px;
            height: 22px;
        }

        .main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .hero {
            display: flex;
            gap: 56px;
            align-items: center;
            max-width: 860px;
            width: 100%;
        }

        .hero-photo {
            flex-shrink: 0;
        }

        .hero-photo img {
            width: 240px;
            height: 240px;
            object-fit: cover;
            border-radius: 50%;
            display: block;
        }

        .hero-text h1 {
            font-size: 36px;
            font-weight: normal;
            color: #1a1a1a;
            margin-bottom: 20px;
            line-height: 1.2;
            letter-spacing: -0.5px;
        }

        .hero-text .tagline {
            font-size: 18px;
            color: #555;
            font-style: italic;
            line-height: 1.6;
            margin-bottom: 28px;
        }

        .linktree-link {
            display: inline-block;
            font-size: 17px;
            color: #2a8f7e;
            text-decoration: none;
            font-style: normal;
            border-bottom: 1px solid #2a8f7e;
            padding-bottom: 2px;
            transition: all 0.2s ease;
        }

        .linktree-link:hover {
            color: #1f6b62;
            border-bottom-color: #1f6b62;
        }

        .footer {
            text-align: center;
            padding: 24px 20px;
            color: #aaa;
            font-size: 13px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        @media (max-width: 700px) {
            .logo-header {
                padding: 24px 16px 8px;
            }

            .hero {
                flex-direction: column;
                text-align: center;
                gap: 32px;
            }

            .hero-photo img {
                width: 180px;
                height: 180px;
            }

            .hero-text h1 {
                font-size: 28px;
            }

            .hero-text .tagline {
                font-size: 16px;
            }

            .main {
                padding: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="logo-header">
        <img src="logo.png" alt="Inner Tech Lab">
    </div>

    </div>

    <div class="main">
        <div class="hero">
            <div class="hero-photo">
                <img src="marijke.jpg" alt="Marijke Wouters">
            </div>
            <div class="hero-text">
                <h1>Hi dear human.</h1>
                <p class="tagline">Things are constantly moving in my work. You'll find all current projects, writings, and ways to connect gathered in one place.</p>

            </div>
        </div>
    </div>

    <div class="footer">
        Inner Tech Lab · Leuven, Belgium · marijke@innertechlab.com
    </div>
</body>
</html>
